# Copy this file to an operator-owned directory outside any reviewed checkout.
# Every other review runtime setting keeps its built-in default; override only
# what this installation actually needs. This profile is NOT a filesystem or
# network sandbox.

[workshop]
executable = "/project/scripts/workshop_shim.py"

[test_shim]
omp_executable = "/var/lib/workshop/sdk/omp/bin/omp"
gateway_url = "http://127.0.0.1:4000"
token_env = "PI_GATEWAY_TOKEN"

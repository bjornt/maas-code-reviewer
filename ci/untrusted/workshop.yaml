# ci/untrusted/workshop.yaml — the CI untrusted container (PLAN.md step 9).
#
# `review` runs here with zero GitHub/Launchpad credentials: the runner host
# only brokers files into and out of this project directory, and PR content
# enters as data, never tooling. Since the engine swap (PLAN.md step 15) the
# definition also selects the omp SDK — the agent harness for `review` — and
# the inference plug below tunnels to the host's omp-auth-gateway
# (127.0.0.1:4000, PLAN.md step 14): the only secret entering this container
# is the per-run, gateway-scoped token passed to the review run's
# environment, and it authorizes exactly what the agent may do anyway.
#
# Never use the root workshop.yaml (the dev environment) here.
name: untrusted
base: ubuntu@26.04
sdks:
  - name: maas-code-reviewer
    channel: latest/stable
  - name: omp
    plugs:
      inference:
        interface: tunnel
        endpoint: 127.0.0.1:4000

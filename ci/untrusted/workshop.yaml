# ci/untrusted/workshop.yaml — the CI untrusted container (PLAN.md step 9).
#
# `review` runs here with zero GitHub/Launchpad credentials: the runner host
# only brokers files into and out of this project directory, and PR content
# enters as data, never tooling. Phase-B intermediate: this definition
# carries ONLY the maas-code-reviewer SDK — the omp SDK and the inference
# plug to the host omp-auth-gateway arrive with the engine swap (PLAN.md
# step 15), when the workflow passes the per-run gateway token (PLAN.md
# step 14) to the review run's environment in place of the Gemini API key.
#
# Never use the root workshop.yaml (the dev environment) here.
name: untrusted
base: ubuntu@26.04
sdks:
  - name: maas-code-reviewer
    channel: latest/stable

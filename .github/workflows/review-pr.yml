name: LLM Code Review

# Run trusted workflow/coordinator code, never Python code from the PR checkout.
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Operator-provisioned, dedicated ephemeral runner with Workshop/LXD and uv.
    runs-on: [self-hosted, linux, x64, maas-review-workshop]
    timeout-minutes: 30
    steps:
      - name: Check out trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: _coordinator
          persist-credentials: false

      - name: Check out PR head for isolated input snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _review
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Verify host prerequisites and install trusted coordinator
        working-directory: ${{ runner.temp }}
        env:
          RUNTIME_CONFIG: ${{ vars.MAAS_REVIEW_RUNTIME_CONFIG || '/etc/maas-code-reviewer/runtime.toml' }}
        run: |
          command -v workshop
          workshop --version
          command -v uv
          test -r "$RUNTIME_CONFIG"
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/_coordinator/.venv" \
            uv sync --project "$GITHUB_WORKSPACE/_coordinator" --frozen --no-dev

      - name: Review and publish validated findings
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_CONFIG: ${{ vars.MAAS_REVIEW_RUNTIME_CONFIG || '/etc/maas-code-reviewer/runtime.toml' }}
          MODEL: ${{ vars.MAAS_REVIEW_MODEL }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(
            --runtime-config "$RUNTIME_CONFIG"
            --repo-dir "$GITHUB_WORKSPACE/_review"
            --metrics "$RUNNER_TEMP/metrics.json"
            --otel-output "$RUNNER_TEMP/otel"
          )
          if [ -n "$MODEL" ]; then
            args+=(--model "$MODEL")
          fi
          "$GITHUB_WORKSPACE/_coordinator/.venv/bin/maas-code-reviewer" review-pr \
            "${args[@]}" "https://github.com/$REPOSITORY/pull/$PR_NUMBER"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-metrics-pr${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/metrics.json
            ${{ runner.temp }}/otel/*.jsonl
          retention-days: 30
          if-no-files-found: ignore

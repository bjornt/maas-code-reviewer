name: Manual PR Review

# Dispatch only trusted repository revisions. PR contents are input, not tooling.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number in this repository to re-review"
        required: true
        type: number
      model:
        description: "Exact model identity allowed by the operator runtime profile (blank uses its default)"
        required: false
        type: string
      review_timeout:
        description: "Total review startup and agent deadline in seconds"
        required: false
        type: number
        default: 600
      max_diff_chars:
        description: "Maximum initial diff context in characters before file-boundary truncation"
        required: false
        type: number
        default: 200000
      dry_run:
        description: "Print validated review JSON instead of publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: [self-hosted, linux, x64, maas-review-workshop]
    timeout-minutes: 30
    steps:
      - name: Resolve PR ref
        id: pr
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=refs/pull/$PR_NUMBER/head" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$REPOSITORY/pull/$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out trusted coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: _coordinator
          persist-credentials: false

      - name: Check out PR head for isolated input snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          path: _review
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Verify host prerequisites and install trusted coordinator
        working-directory: ${{ runner.temp }}
        env:
          RUNTIME_CONFIG: ${{ vars.MAAS_REVIEW_RUNTIME_CONFIG || '/etc/maas-code-reviewer/runtime.toml' }}
        run: |
          command -v workshop
          workshop --version
          command -v uv
          test -r "$RUNTIME_CONFIG"
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/_coordinator/.venv" \
            uv sync --project "$GITHUB_WORKSPACE/_coordinator" --frozen --no-dev

      - name: Review and optionally publish validated findings
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_CONFIG: ${{ vars.MAAS_REVIEW_RUNTIME_CONFIG || '/etc/maas-code-reviewer/runtime.toml' }}
          PR_URL: ${{ steps.pr.outputs.url }}
          MODEL: ${{ inputs.model }}
          REVIEW_TIMEOUT: ${{ inputs.review_timeout }}
          MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(
            --runtime-config "$RUNTIME_CONFIG"
            --review-timeout "$REVIEW_TIMEOUT"
            --max-diff-chars "$MAX_DIFF_CHARS"
            --repo-dir "$GITHUB_WORKSPACE/_review"
            --metrics "$RUNNER_TEMP/metrics.json"
          )
          if [ -n "$MODEL" ]; then
            args+=(--model "$MODEL")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          "$GITHUB_WORKSPACE/_coordinator/.venv/bin/maas-code-reviewer" review-pr "${args[@]}" "$PR_URL"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-metrics-manual-pr${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/metrics.json
          retention-days: 30
          if-no-files-found: ignore

name: Nightly build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check for new commits
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous="$(gh api repos/{owner}/{repo}/releases --paginate \
            --jq 'first(.[] | select(.tag_name | startswith("nightly-")) | .target_commitish)')"
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "Nightly for $GITHUB_SHA already published."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changed.outputs.stale == 'false'
        run: uv sync --frozen

      - name: Check
        if: steps.changed.outputs.stale == 'false'
        run: make check

      - name: Build dated development version
        if: steps.changed.outputs.stale == 'false'
        id: version
        run: |
          stamp="$(date -u +%Y%m%d%H%M)"
          base="$(uv version --bump minor --dry-run --short)"
          uv version --no-sync "${base}.dev${stamp}"
          uv build
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        if: steps.changed.outputs.stale == 'false'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAMP: ${{ steps.version.outputs.stamp }}
        run: |
          gh release create "nightly-$STAMP" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $STAMP" \
            --notes "Automated nightly build of ${GITHUB_SHA}. Unsupported: for testing only."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Prune superseded nightlies
        if: steps.changed.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/{owner}/{repo}/releases --paginate \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | .tag_name' \
            | sort -r | tail -n +15 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag

  index:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Generate simple index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/{owner}/{repo}/releases --paginate \
            --jq '[.[] | select(.tag_name | startswith("nightly-")) | .assets[]
                  | {name, url: .browser_download_url, digest}]' \
            | python3 scripts/build_simple_index.py \
                --project maas-code-reviewer --output site/simple

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
